name: test-codebase-on-push-to-main
on:
  push:
    branches:
      - main

jobs:
  test-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: mv .env.example .env
      - run: docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from test --build
