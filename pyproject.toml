[project]
name = "tevira-ai"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "alembic (==1.18.5)",
    "dateparser (==1.4.1)",
    "fastapi (==0.136.3)",
    "psycopg[binary] (==3.3.4)",
    "psycopg-pool (==3.3.1)",
    "pydantic (==2.13.4)",
    "pydantic-core (==2.46.4)",
    "python-dotenv (==1.2.2)",
    "sqlalchemy (==2.0.51)",
    "uvicorn (==0.48.0)",
]

[dependency-groups]
dev = [
    "commitizen (==4.17.0)",
    "pip-check-reqs (==2.5.6)",
    "pre-commit (==4.6.1)",
    "deptry (>=0.25.1,<0.26.0)",
]

test = [
    "pytest (==9.0.3)",
    "pytest-cov (==7.1.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (==0.28.1)",
    "httpx2 (==2.3.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = ["old_tests"]

[tool.pyright]
extraPaths = ["./"]