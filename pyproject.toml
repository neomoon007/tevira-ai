    "questionary (==2.1.1)",
    "regex (==2026.6.28)",
    "six (==1.17.0)",
    "sqlalchemy (==2.0.51)",
    "starlette (==1.2.1)",
    "termcolor (==3.3.0)",
    "tomlkit (==0.15.1)",
    "truststore (==0.10.4)",
    "typing-inspection (==0.4.2)",
    "typing-extensions (==4.15.0)",
    "tzlocal (==5.4.4)",
    "uvicorn (==0.48.0)",
    "virtualenv (==21.7.1)",
    "wcwidth (==0.8.2)",
    "wrapt (==2.3.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = ["old_tests"]

[tool.pyright]
extraPaths = ["./"]