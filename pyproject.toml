[project]
name = "tevira-ai"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "alembic (==1.18.5)",
    "annotated-doc (==0.0.4)",
    "annotated-types (==0.7.0)",
    "anyio (==4.13.0)",
    "argcomplete (==3.7.1)",
    "certifi (==2026.5.20)",
    "cfgv (==3.5.0)",
    "charset-normalizer (==3.4.9)",
    "click (==8.4.1)",
    "colorama (==0.4.6)",
    "commitizen (==4.17.0)",
    "coverage (==7.15.3)",
    "dateparser (==1.4.1)",
    "decli (==0.6.3)",
    "deprecated (==1.3.1)",
    "distlib (==0.4.3)",
    "fastapi (==0.136.3)",
    "filelock (==3.32.2)",
    "greenlet (==3.5.3)",
    "h11 (==0.16.0)",
    "httpcore (==1.0.9)",
    "httpcore2 (==2.3.0)",
    "httpx (==0.28.1)",
    "httpx2 (==2.3.0)",
    "identify (==2.6.19)",
    "idna (==3.17)",
    "iniconfig (==2.3.0)",
    "jinja2 (==3.1.6)",
    "mako (==1.3.12)",
    "markupsafe (==3.0.3)",
    "nodeenv (==1.10.0)",
    "packaging (==26.2)",
    "pip-check-reqs (==2.5.6)",
    "platformdirs (==4.11.0)",
    "pluggy (==1.6.0)",
    "pre-commit (==4.6.1)",
    "prompt-toolkit (==3.0.53)",
    "psycopg (==3.3.4)",
    "psycopg-binary (==3.3.4)",
    "psycopg-pool (==3.3.1)",
    "pydantic (==2.13.4)",
    "pydantic-core (==2.46.4)",
    "pygments (==2.20.0)",
    "pytest (==9.0.3)",
    "pytest-cov (==7.1.0)",
    "python-dateutil (==2.9.0.post0)",
    "python-discovery (==1.5.1)",
