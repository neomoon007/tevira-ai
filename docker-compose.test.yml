services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: tevira_test_suite
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TEST_DB}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tevira_net

  postgres:
    image: postgres:18
    container_name: ${CONTAINER_NAME}
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TEST_DB}
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_TEST_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - tevira_net

volumes:
  postgres_test_data:

networks:
  tevira_net:
    driver: bridge